<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>シクロアルカン構造シミュレータ</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="シクロアルカン" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1048/1048455.png" />

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js" } }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { margin:0; overflow:hidden; background:#f3f4f6; color:#111827; font-family:sans-serif; }
    canvas { display:block; touch-action:none; } /* ピンチでブラウザがズームしない */
    .panel{
      position:absolute; top:16px; left:16px; z-index:10;
      background:rgba(255,255,255,0.95);
      border:1px solid #e5e7eb; border-radius:12px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.08);
      padding:12px; width:320px; max-width:calc(100% - 32px);
    }
    .hint{
      position:absolute; bottom:14px; left:14px; z-index:10;
      background:rgba(255,255,255,0.92);
      border:1px solid #e5e7eb; border-radius:12px;
      padding:10px 12px; font-size:12px; color:#374151;
      max-width: calc(100% - 28px);
    }
    @media (max-width: 768px){ .panel{ width: 290px; } }
  </style>
</head>

<body>
  <div class="panel">
    <div class="flex items-center justify-between mb-2">
      <div class="text-indigo-600 font-bold text-lg">シクロアルカン構造</div>
      <button id="resetBtn" class="text-xs bg-gray-100 px-3 py-1.5 rounded-lg text-gray-600 hover:bg-gray-200">視点リセット</button>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-gray-500 mb-1">分子を選択</label>
      <select id="molSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
        <option value="c3" selected>シクロプロパン (C3H6)</option>
        <option value="c4">シクロブタン (C4H8)</option>
        <option value="c5">シクロペンタン (C5H10)</option>
        <option value="c6">シクロヘキサン (C6H12)</option>
      </select>
    </div>

    <div id="c6Controls" class="mb-3" style="display:none;">
      <label class="block text-xs font-semibold text-gray-500 mb-1">シクロヘキサン配座</label>
      <div class="grid grid-cols-2 gap-2">
        <button id="chairBtn" class="bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110">椅子形</button>
        <button id="boatBtn"  class="bg-white border border-gray-300 text-gray-700 font-bold py-2 rounded-xl text-xs hover:bg-gray-50">舟形</button>
      </div>

      <button id="playBtn" class="mt-2 w-full bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110">
        椅子形 ⇄ 舟形 を自動再生
      </button>

      <div class="text-[11px] text-gray-500 mt-1">
        ※切替はアニメーションで変形しつつ、C–C結合長とC–C–C角を拘束して補正
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <button id="toggleH" class="bg-slate-900 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110">水素表示 ON</button>
      <button id="toggleLabel" class="bg-blue-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110">炭素番号 OFF</button>
    </div>

    <div class="text-[11px] text-gray-500">
      1本指ドラッグ：回転 / ピンチ：拡大・縮小（ズーム）
    </div>
  </div>

  <div class="hint" id="descBox">
    <div class="font-bold" id="descTitle">シクロプロパン</div>
    <div id="descText">環角（C–C–C）は60°。結合はひずみを受けます。</div>
  </div>

  <script type="module">
    import * as THREE from "three";

    // ==========
    // 定数
    // ==========
    const BOND_CC = 1.54;
    const BOND_CH = 1.09;
    const TETRA = 109.5 * Math.PI/180;

    const R_C = 0.40;
    const R_H = 0.25;

    const COLOR_C = 0x2f2f2f;
    const COLOR_H = 0xadd8e6;
    const COLOR_BOND = 0xcccccc;

    // 環角（C–C–C）の目標：代表的な値（教材用の「理想」）
    const RING_ANGLE_TARGET = {
      c3: 60.0  * Math.PI/180,
      c4: 90.0  * Math.PI/180,
      c5: 108.0 * Math.PI/180,
      c6: 111.5 * Math.PI/180
    };

    // 拘束（反復回数）
    const LEN_ITERS   = 18; // 長さ
    const ANG_ITERS   = 14; // 角度
    const RELAX_ITERS = 22; // 全体
    const FOLLOW = 0.28;    // 形テンプレ追従度

    // 変形（c6）
    let morphT = 0;       // 0=chair, 1=boat
    let morphTarget = 0;
    let isMorphing = false;
    let isPlaying = false;
    let morphDir = 1;
    const MORPH_SPEED = 0.06;
    const PLAY_SPEED  = 0.010;

    // UI状態
    let showH = true;
    let showLabel = false;
    let currentMol = "c3";

    // three.js
    let scene, camera, renderer, root;

    // タッチ操作
    let dragging = false, lastX = 0, lastY = 0;
    let lastPinchDist = null;

    // 描画参照
    let carbonMeshes = [];
    let hydrogenMeshes = [];
    let ccBondMeshes = [];
    let chBondMeshes = [];
    let labelSprites = [];

    // リング点
    let ringPts = [];
    let ringTarget = [];

    // ==========
    // 幾何ユーティリティ
    // ==========
    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    function rotateAroundAxis(vec, axis, angle) {
      const q = new THREE.Quaternion().setFromAxisAngle(axis, angle);
      return vec.applyQuaternion(q);
    }

    function angleAt(a, b, c) {
      const v1 = a.clone().sub(b).normalize();
      const v2 = c.clone().sub(b).normalize();
      return Math.acos(clamp(v1.dot(v2), -1, 1));
    }

    // ==========
    // (1) 長さ拘束：隣接点の距離をBOND_CCに揃える
    // ==========
    function enforceBondLengths(points, targetLen) {
      const n = points.length;
      for (let iter=0; iter<LEN_ITERS; iter++) {
        for (let i=0; i<n; i++) {
          const j = (i+1)%n;
          const pi = points[i];
          const pj = points[j];
          const d = pj.clone().sub(pi);
          const dist = d.length();
          if (dist < 1e-9) continue;
          const diff = (dist - targetLen) / dist;
          const corr = d.multiplyScalar(0.5 * diff);
          pi.add(corr);
          pj.sub(corr);
        }
      }
    }

    // ==========
    // (2) 角度拘束：C–C–C角を目標に近づける（回転で補正）
    //     bを中心に、aとcを軸(axis=cross)周りに±回転 → 距離(b-a),(b-c)は保持
    // ==========
    function enforceRingAngles(points, targetAngle) {
      const n = points.length;
      for (let iter=0; iter<ANG_ITERS; iter++) {
        for (let i=0; i<n; i++) {
          const im1 = (i-1+n)%n;
          const ip1 = (i+1)%n;

          const a = points[im1];
          const b = points[i];
          const c = points[ip1];

          const v1 = a.clone().sub(b);
          const v2 = c.clone().sub(b);
          const nrm = new THREE.Vector3().crossVectors(v1, v2);
          if (nrm.lengthSq() < 1e-10) continue;
          nrm.normalize();

          const cur = angleAt(a,b,c);
          const err = cur - targetAngle; // +なら広すぎ
          if (Math.abs(err) < 1e-4) continue;

          // 回転量（半分ずつ）
          const delta = clamp(err * 0.35, -0.12, 0.12); // 過剰補正防止
          const va = a.clone().sub(b);
          const vc = c.clone().sub(b);

          // aを +delta、cを -delta 回転（角を狭めたり広げたり）
          rotateAroundAxis(va, nrm, +delta);
          rotateAroundAxis(vc, nrm, -delta);

          a.copy(b.clone().add(va));
          c.copy(b.clone().add(vc));
        }
      }
    }

    // ==========
    // (3) 全体リラックス：長さ→角度→長さ を複数回
    // ==========
    function relaxRing(points, molKey) {
      const targetAng = RING_ANGLE_TARGET[molKey] ?? (109.5*Math.PI/180);
      for (let k=0; k<RELAX_ITERS; k++) {
        enforceBondLengths(points, BOND_CC);
        enforceRingAngles(points, targetAng);
        enforceBondLengths(points, BOND_CC);
      }
    }

    // ==========
    // テンプレ（“理想形の雰囲気”）→ その後 relaxRing で角度・長さを整える
    // ==========
    function templateRing(molKey, conformer="chair") {
      if (molKey === "c3") {
        // 正三角形（環角60°）
        const R = 1.10;
        return [
          new THREE.Vector3( R, 0, 0),
          new THREE.Vector3(-R/2,  Math.sqrt(3)*R/2, 0),
          new THREE.Vector3(-R/2, -Math.sqrt(3)*R/2, 0),
        ];
      }

      if (molKey === "c4") {
        // パッカリング（折れ）を入れる
        const R = 1.05, h = 0.55;
        return [
          new THREE.Vector3( R, 0,  h),
          new THREE.Vector3( 0, R, -h),
          new THREE.Vector3(-R, 0,  h),
          new THREE.Vector3( 0,-R, -h),
        ];
      }

      if (molKey === "c5") {
        // エンベロープ
        const ang = (2*Math.PI)/5;
        const R = 1.20;
        const pts = [];
        for (let i=0;i<5;i++){
          const a = i*ang;
          pts.push(new THREE.Vector3(R*Math.cos(a), R*Math.sin(a), 0));
        }
        pts[0].z = 0.85;
        pts[2].z = -0.30;
        return pts;
      }

      // c6
      if (molKey === "c6") {
        if (conformer === "chair") {
          // 典型的な椅子形の“上下交互”を強めたテンプレ
          return [
            new THREE.Vector3( 1.55,  0.00,  0.85),
            new THREE.Vector3( 0.78,  1.28,  0.20),
            new THREE.Vector3(-0.78,  1.28, -0.85),
            new THREE.Vector3(-1.55,  0.00, -0.20),
            new THREE.Vector3(-0.78, -1.28,  0.85),
            new THREE.Vector3( 0.78, -1.28, -0.20),
          ];
        } else {
          // 舟形（旗竿Hが近づく“両端UP”を出す）
          return [
            new THREE.Vector3( 1.50,  0.10,  1.10),
            new THREE.Vector3( 0.85,  1.30,  0.15),
            new THREE.Vector3(-0.85,  1.15, -0.45),
            new THREE.Vector3(-1.50, -0.10,  1.10),
            new THREE.Vector3(-0.85, -1.30,  0.15),
            new THREE.Vector3( 0.85, -1.15, -0.45),
          ];
        }
      }

      return [];
    }

    // ==========
    // 水素方向（できるだけsp3っぽく）
    // - まず環の局所法線を出す
    // - 「外向き」+「法線」から2方向（H2つ）を作る
    // - c6だけは上下（z符号）を優先して“アキシャル/エクアトリアル風”を強める
    // ==========
    function hydrogenDirs(pts, i, molKey) {
      const n = pts.length;
      const p = pts[i];
      const pPrev = pts[(i-1+n)%n];
      const pNext = pts[(i+1)%n];

      const v1 = pPrev.clone().sub(p).normalize();
      const v2 = pNext.clone().sub(p).normalize();

      let normal = new THREE.Vector3().crossVectors(v1, v2);
      if (normal.lengthSq() < 1e-10) normal = new THREE.Vector3(0,0,1);
      normal.normalize();

      // outward（環の外側へ）
      let outward = v1.clone().add(v2);
      if (outward.lengthSq() < 1e-10) outward = new THREE.Vector3(1,0,0);
      outward.normalize().multiplyScalar(-1);

      if (molKey === "c6") {
        // 椅子形の上下っぽさを出す（z符号を優先）
        let sign = Math.sign(p.z);
        if (sign === 0) sign = (i % 2 === 0) ? 1 : -1;

        const axial = normal.clone().multiplyScalar(sign).normalize();
        const equat = outward.clone().multiplyScalar(0.92).add(normal.clone().multiplyScalar(0.38*sign)).normalize();

        return [axial, equat];
      } else {
        // 他は「平面に寝ない」ことを優先して外向き±法線
        const d1 = outward.clone().multiplyScalar(0.85).add(normal.clone().multiplyScalar(0.65)).normalize();
        const d2 = outward.clone().multiplyScalar(0.85).add(normal.clone().multiplyScalar(-0.65)).normalize();
        return [d1, d2];
      }
    }

    // ==========
    // 描画系
    // ==========
    function makeSphere(radius, color) {
      const mat = new THREE.MeshPhongMaterial({ color });
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 22, 22), mat);
    }

    function makeCylinder(thickness) {
      const geo = new THREE.CylinderGeometry(thickness, thickness, 1, 16);
      const mat = new THREE.MeshPhongMaterial({ color: COLOR_BOND });
      return new THREE.Mesh(geo, mat);
    }

    function setBondTransform(cyl, a, b) {
      const dir = b.clone().sub(a);
      const len = dir.length();
      const mid = a.clone().add(b).multiplyScalar(0.5);
      cyl.position.copy(mid);
      cyl.scale.set(1, len, 1);
      cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
    }

    function addLabel(text) {
      const canvas = document.createElement("canvas");
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,256,256);
      ctx.fillStyle = "rgba(0,0,0,0.75)";
      ctx.beginPath(); ctx.arc(128,128,90,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "white";
      ctx.font = "bold 120px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 140);

      const tex = new THREE.CanvasTexture(canvas);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest:false }));
      spr.scale.set(0.55,0.55,1);
      root.add(spr);
      return spr;
    }

    function clearAll() {
      carbonMeshes = [];
      hydrogenMeshes = [];
      ccBondMeshes = [];
      chBondMeshes = [];
      labelSprites = [];
      ringPts = [];
      ringTarget = [];
      while(root.children.length) root.remove(root.children[0]);
    }

    function applyVisibility() {
      hydrogenMeshes.forEach(m => m.visible = showH);
      chBondMeshes.forEach(m => m.visible = showH);
      labelSprites.forEach(s => s.visible = showLabel);
    }

    function recenterAndFitCamera() {
      const pts = ringPts;
      const box = new THREE.Box3();
      pts.forEach(p => box.expandByPoint(p));
      const center = new THREE.Vector3();
      box.getCenter(center);
      for (let i=0;i<pts.length;i++) pts[i].sub(center);

      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = Math.max(6, maxDim * 2.9 + 2);
      camera.position.set(0, 0, dist);
    }

    function applyGeometryFromRing() {
      const pts = ringPts;
      const n = pts.length;

      for (let i=0;i<n;i++) carbonMeshes[i].position.copy(pts[i]);

      for (let i=0;i<n;i++){
        const a = pts[i];
        const b = pts[(i+1)%n];
        setBondTransform(ccBondMeshes[i], a, b);
      }

      let hIdx = 0;
      for (let i=0;i<n;i++){
        const dirs = hydrogenDirs(pts, i, currentMol);
        for (let k=0;k<2;k++){
          const hPos = pts[i].clone().add(dirs[k].clone().multiplyScalar(BOND_CH));
          hydrogenMeshes[hIdx].position.copy(hPos);
          setBondTransform(chBondMeshes[hIdx], pts[i], hPos);
          hIdx++;
        }
      }

      for (let i=0;i<n;i++){
        labelSprites[i].position.copy(pts[i].clone().add(new THREE.Vector3(0,0.55,0)));
      }
    }

    function updateDescription() {
      const title = document.getElementById("descTitle");
      const text = document.getElementById("descText");
      if (currentMol === "c3") {
        title.textContent = "シクロプロパン";
        text.textContent  = "環角（C–C–C）は60°。強い角ひずみが生じます。";
      } else if (currentMol === "c4") {
        title.textContent = "シクロブタン";
        text.textContent  = "環角は約90°。ひずみを減らすため折れ曲がった形になりやすいです。";
      } else if (currentMol === "c5") {
        title.textContent = "シクロペンタン";
        text.textContent  = "環角は約108°。エンベロープ型などでひずみを減らします。";
      } else {
        title.textContent = "シクロヘキサン";
        if (morphT < 0.5) text.textContent = "椅子形：理想的なsp³配座に近く、比較的安定。";
        else text.textContent = "舟形：旗竿水素が近づき、ねじれ/立体ひずみが増えやすい。";
      }
    }

    function setC6ButtonState(conformer) {
      const chairBtn = document.getElementById("chairBtn");
      const boatBtn  = document.getElementById("boatBtn");
      if (conformer === "chair") {
        chairBtn.className = "bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110";
        boatBtn.className  = "bg-white border border-gray-300 text-gray-700 font-bold py-2 rounded-xl text-xs hover:bg-gray-50";
      } else {
        boatBtn.className  = "bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110";
        chairBtn.className = "bg-white border border-gray-300 text-gray-700 font-bold py-2 rounded-xl text-xs hover:bg-gray-50";
      }
    }

    function initMolecule(molKey) {
      clearAll();

      // 初期テンプレ → 角度/長さを拘束して“理想的”へ
      ringPts = templateRing(molKey, "chair").map(p => p.clone());
      relaxRing(ringPts, molKey);

      const n = ringPts.length;

      for (let i=0;i<n;i++){
        const m = makeSphere(R_C, COLOR_C);
        root.add(m);
        carbonMeshes.push(m);
      }

      for (let i=0;i<n;i++){
        const b = makeCylinder(0.08);
        root.add(b);
        ccBondMeshes.push(b);
      }

      for (let i=0;i<2*n;i++){
        const h = makeSphere(R_H, COLOR_H);
        root.add(h);
        hydrogenMeshes.push(h);

        const b = makeCylinder(0.045);
        root.add(b);
        chBondMeshes.push(b);
      }

      for (let i=0;i<n;i++){
        const s = addLabel(String(i+1));
        labelSprites.push(s);
      }

      recenterAndFitCamera();
      applyGeometryFromRing();
      applyVisibility();
      updateDescription();
    }

    function resetView() {
      root.rotation.set(0.35, 0.30, 0);
      isPlaying = false;
      isMorphing = false;

      if (currentMol === "c6") {
        morphT = 0;
        morphTarget = 0;
        setC6ButtonState("chair");
        ringPts = templateRing("c6","chair").map(p=>p.clone());
        relaxRing(ringPts, "c6");
      } else {
        ringPts = templateRing(currentMol,"chair").map(p=>p.clone());
        relaxRing(ringPts, currentMol);
      }

      recenterAndFitCamera();
      applyGeometryFromRing();

      const playBtn = document.getElementById("playBtn");
      if (playBtn) playBtn.textContent = "椅子形 ⇄ 舟形 を自動再生";
      updateDescription();
    }

    // ==========
    // c6 変形：テンプレ補間 → relaxRingで結合角/長さを維持しつつ収束
    // ==========
    function updateTargetRingC6() {
      const chair = templateRing("c6", "chair");
      const boat  = templateRing("c6", "boat");
      ringTarget = [];
      for (let i=0;i<6;i++){
        ringTarget.push(chair[i].clone().lerp(boat[i], morphT));
      }
      relaxRing(ringTarget, "c6");
    }

    function stepMorphC6() {
      if (isPlaying) {
        morphT += morphDir * PLAY_SPEED;
        if (morphT >= 1) { morphT = 1; morphDir = -1; }
        if (morphT <= 0) { morphT = 0; morphDir =  1; }
      } else if (isMorphing) {
        const dist = Math.abs(morphTarget - morphT);
        const step = Math.max(0.008, MORPH_SPEED * (0.35 + dist));
        const d = morphTarget - morphT;
        if (Math.abs(d) <= step) { morphT = morphTarget; isMorphing = false; }
        else morphT += Math.sign(d) * step;
      }

      updateTargetRingC6();

      // 追従（滑らか）→ さらに relaxRing で角度・長さを整える
      for (let i=0;i<6;i++){
        ringPts[i].lerp(ringTarget[i], FOLLOW);
      }
      relaxRing(ringPts, "c6");

      setC6ButtonState(morphT < 0.5 ? "chair" : "boat");
      updateDescription();
    }

    // ==========
    // 初期化
    // ==========
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 2000);
      camera.position.set(0, 0, 10);

      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0xf3f4f6, 1);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const dl = new THREE.DirectionalLight(0xffffff, 0.65);
      dl.position.set(7, 10, 6);
      scene.add(dl);

      root = new THREE.Group();
      scene.add(root);

      // ★初期表示：シクロプロパン
      currentMol = "c3";
      document.getElementById("molSelect").value = "c3";
      document.getElementById("c6Controls").style.display = "none";
      initMolecule("c3");
      root.rotation.set(0.35, 0.30, 0);

      // UI
      document.getElementById("molSelect").addEventListener("change", (e) => {
        currentMol = e.target.value;
        isPlaying = false;
        isMorphing = false;

        const c6Panel = document.getElementById("c6Controls");
        if (currentMol === "c6") {
          c6Panel.style.display = "block";
          morphT = 0; morphTarget = 0;
          setC6ButtonState("chair");
          initMolecule("c6");
        } else {
          c6Panel.style.display = "none";
          initMolecule(currentMol);
        }
        resetView();
      });

      document.getElementById("chairBtn").addEventListener("click", () => {
        if (currentMol !== "c6") return;
        isPlaying = false;
        document.getElementById("playBtn").textContent = "椅子形 ⇄ 舟形 を自動再生";
        morphTarget = 0;
        isMorphing = true;
      });

      document.getElementById("boatBtn").addEventListener("click", () => {
        if (currentMol !== "c6") return;
        isPlaying = false;
        document.getElementById("playBtn").textContent = "椅子形 ⇄ 舟形 を自動再生";
        morphTarget = 1;
        isMorphing = true;
      });

      document.getElementById("playBtn").addEventListener("click", () => {
        if (currentMol !== "c6") return;
        isPlaying = !isPlaying;
        document.getElementById("playBtn").textContent = isPlaying ? "自動再生 停止" : "椅子形 ⇄ 舟形 を自動再生";
        if (isPlaying) {
          morphDir = (morphT >= 0.5) ? -1 : 1;
          isMorphing = false;
        }
      });

      document.getElementById("toggleH").addEventListener("click", (e) => {
        showH = !showH;
        e.target.textContent = showH ? "水素表示 ON" : "水素表示 OFF";
        applyVisibility();
      });

      document.getElementById("toggleLabel").addEventListener("click", (e) => {
        showLabel = !showLabel;
        e.target.textContent = showLabel ? "炭素番号 ON" : "炭素番号 OFF";
        applyVisibility();
      });

      document.getElementById("resetBtn").addEventListener("click", resetView);

      // 回転（マウス）
      const el = renderer.domElement;
      el.addEventListener("mousedown", (ev) => { dragging = true; lastX = ev.clientX; lastY = ev.clientY; });
      window.addEventListener("mouseup", () => dragging = false);
      window.addEventListener("mousemove", (ev) => {
        if (!dragging) return;
        const dx = ev.clientX - lastX;
        const dy = ev.clientY - lastY;
        root.rotation.y += dx * 0.01;
        root.rotation.x += dy * 0.01;
        lastX = ev.clientX; lastY = ev.clientY;
      });

      // タッチ：回転 + ピンチズーム
      el.addEventListener("touchstart", (ev) => {
        if (ev.touches.length === 1) {
          dragging = true;
          lastX = ev.touches[0].clientX;
          lastY = ev.touches[0].clientY;
          lastPinchDist = null;
        } else if (ev.touches.length === 2) {
          dragging = false;
          const dx = ev.touches[0].clientX - ev.touches[1].clientX;
          const dy = ev.touches[0].clientY - ev.touches[1].clientY;
          lastPinchDist = Math.hypot(dx, dy);
        }
      }, { passive:false });

      el.addEventListener("touchmove", (ev) => {
        ev.preventDefault();
        if (ev.touches.length === 1 && dragging) {
          const x = ev.touches[0].clientX;
          const y = ev.touches[0].clientY;
          const dx = x - lastX;
          const dy = y - lastY;
          root.rotation.y += dx * 0.01;
          root.rotation.x += dy * 0.01;
          lastX = x; lastY = y;
        } else if (ev.touches.length === 2) {
          const dx = ev.touches[0].clientX - ev.touches[1].clientX;
          const dy = ev.touches[0].clientY - ev.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (lastPinchDist != null) {
            const delta = (lastPinchDist - dist) * 0.02;
            camera.position.z = clamp(camera.position.z + delta, 3.5, 60);
          }
          lastPinchDist = dist;
        }
      }, { passive:false });

      el.addEventListener("touchend", (ev) => {
        if (ev.touches.length === 0) {
          dragging = false;
          lastPinchDist = null;
        }
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (currentMol === "c6") stepMorphC6();
      applyGeometryFromRing();
      renderer.render(scene, camera);
    }

    window.addEventListener("load", () => setTimeout(init, 50));
  </script>
</body>
</html>
