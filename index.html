<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>シクロアルカン構造シミュレータ</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="シクロアルカン構造">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1048/1048455.png">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #f3f4f6; color: #1f2937; font-family: sans-serif; touch-action: manipulation; }
    canvas { display:block; touch-action:none; }

    .controls{
      position:absolute; top:20px; left:20px; z-index:10;
      background: rgba(255,255,255,0.95);
      padding: 14px;
      border-radius: 12px;
      max-width: 340px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      border: 1px solid #e5e7eb;
      max-height: 85vh;
      overflow-y:auto;
      transition: transform .3s ease, opacity .3s ease;
    }
    .controls.minimized{ transform: translateX(-200%); opacity: 0; pointer-events:none; }

    .toggle-ui-btn{
      position:absolute; top:20px; left:20px; z-index:20;
      background:#4f46e5; color:#fff;
      padding:8px 12px;
      border-radius:8px;
      font-weight:700;
      font-size:12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .info{
      position:absolute; bottom:20px; left:20px; z-index:10;
      background: rgba(255,255,255,0.9);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      border: 1px solid #e5e7eb;
      max-width: calc(100% - 40px);
    }

    .mini-btn{ border:1px solid #d1d5db; background:#fff; color:#374151; }
    .mini-btn.active{ background:#111827; color:#fff; border-color:#111827; }

    @media (max-width: 768px){
      .controls{ top:10px; left:10px; width: 300px; padding:12px; }
      .toggle-ui-btn{ top:10px; left:10px; }
      .info{ bottom:10px; left:10px; }
    }
  </style>
</head>

<body>
  <button id="toggleUIPanel" class="toggle-ui-btn hidden">メニュー表示</button>

  <div id="controlsPanel" class="controls">
    <div class="flex justify-between items-center mb-3">
      <h1 class="text-lg font-bold text-indigo-600">シクロアルカン構造</h1>
      <button id="hideUIPanel" class="text-xs bg-gray-100 px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-200 ml-4">閉じる</button>
    </div>

    <div class="mb-3">
      <label class="block mb-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">分子を選択</label>
      <select id="ringSelect" class="bg-white border border-gray-300 rounded-lg p-2.5 w-full text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="3" selected>シクロプロパン (C3H6)</option>
        <option value="4">シクロブタン (C4H8)</option>
        <option value="5">シクロペンタン (C5H10)</option>
        <option value="6">シクロヘキサン (C6H12)</option>
        <option value="7">シクロヘプタン (C7H14)</option>
        <option value="8">シクロオクタン (C8H16)</option>
      </select>
    </div>

    <div id="cycloHexControls" class="mb-3 hidden">
      <label class="block mb-1 text-xs font-semibold text-gray-400 uppercase tracking-wider">シクロヘキサン配座</label>
      <div class="grid grid-cols-2 gap-2">
        <button id="toggleConformation" class="bg-indigo-600 text-white font-bold py-2 rounded-xl text-[10px] hover:brightness-110 transition">
          椅子型 ⇄ 舟形
        </button>
        <button id="playConformation" class="mini-btn font-bold py-2 rounded-xl text-[10px] transition">
          動画再生 OFF
        </button>
      </div>
      <div class="mt-2 text-[10px] text-gray-500 leading-relaxed">
        「椅子型 ⇄ 舟形」：1回だけ変形<br>
        「動画再生」：椅子型⇄舟形を繰り返し
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <button id="resetViewBtn" class="bg-white border border-gray-200 py-2 rounded-xl text-[10px] text-gray-600 font-bold hover:bg-gray-50">
        視点リセット
      </button>
      <button id="toggleHydrogen" class="mini-btn font-bold py-2 rounded-xl text-[10px] transition active">
        水素表示 ON
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <button id="toggleLabels" class="mini-btn font-bold py-2 rounded-xl text-[10px] transition">
        炭素番号 OFF
      </button>
      <button id="autoRotateBtn" class="bg-emerald-600 text-white font-bold py-2 rounded-xl text-[10px] hover:brightness-110 transition">
        自動回転 ON
      </button>
    </div>

    <div class="mt-2 text-[10px] text-gray-500 leading-relaxed">
      1本指ドラッグ：回転<br>
      ピンチ：拡大・縮小（ズーム）
    </div>
  </div>

  <div id="description" class="info">
    <h2 id="molTitle" class="font-bold text-sm text-gray-800">シクロプロパン</h2>
    <p id="molDesc" class="text-[10px] text-gray-600">
      シクロアルカンは環状構造をもちます。シクロヘキサンは配座（椅子型・舟形）をとります。
    </p>
  </div>

  <script type="module">
    import * as THREE from "three";

    // ====== Scene ======
    let scene, camera, renderer;
    let moleculeGroup;
    let showHydrogen = true;
    let showLabels = false;

    // rotation/zoom
    let isAutoRotate = true;
    let zoomScale = 1.0;
    const ZOOM_MIN = 0.35, ZOOM_MAX = 3.5;

    // ====== Geometry params ======
    const BOND_CC = 1.54;
    const BOND_CH = 1.09;

    const RADIUS_C = 0.40;
    const RADIUS_H = 0.25;

    // Ring radius (approx so that neighbor distance ~1.54)
    function ringRadius(n){
      // side length s = 2R sin(pi/n) => R = s/(2 sin(pi/n))
      return BOND_CC / (2 * Math.sin(Math.PI / n));
    }

    // ====== Objects references ======
    let carbonMeshes = [];
    let hydrogenMeshes = [];
    let bondCCMeshes = [];
    let bondCHMeshes = [];
    let labelSprites = [];

    // ====== Cyclohexane conformation animation ======
    let currentRing = 3;
    let conformation = "chair"; // for n=6 only: 'chair' or 'boat'
    let targetConformation = "chair";
    let confT = 0;            // 0->1 interpolation chair->boat (or reverse depending on start/end)
    let confAnimating = false;
    let confLoopPlaying = false;

    // ====== UI elements ======
    const elRing = document.getElementById("ringSelect");
    const elCycloHexControls = document.getElementById("cycloHexControls");
    const elToggleConf = document.getElementById("toggleConformation");
    const elPlayConf = document.getElementById("playConformation");
    const elToggleHydrogen = document.getElementById("toggleHydrogen");
    const elToggleLabels = document.getElementById("toggleLabels");
    const elAutoRotate = document.getElementById("autoRotateBtn");
    const elReset = document.getElementById("resetViewBtn");
    const elTitle = document.getElementById("molTitle");
    const elDesc = document.getElementById("molDesc");

    // ====== init ======
    function init(){
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 0, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0xf3f4f6, 1);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const light = new THREE.DirectionalLight(0xffffff, 0.7);
      light.position.set(6, 10, 7);
      scene.add(light);

      moleculeGroup = new THREE.Group();
      scene.add(moleculeGroup);

      setupInteractions();
      updateMoleculeFromUI();
      animate();
    }

    // ====== build helpers ======
    function clearGroup(){
      while(moleculeGroup.children.length > 0) moleculeGroup.remove(moleculeGroup.children[0]);
      carbonMeshes = [];
      hydrogenMeshes = [];
      bondCCMeshes = [];
      bondCHMeshes = [];
      labelSprites = [];
    }

    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    function makeAtomSphere(radius, color){
      const geo = new THREE.SphereGeometry(radius, 20, 20);
      const mat = new THREE.MeshPhongMaterial({ color });
      return new THREE.Mesh(geo, mat);
    }

    function makeBondCylinder(length, radius, color, opacity=1){
      const geo = new THREE.CylinderGeometry(radius, radius, length, 14);
      const mat = new THREE.MeshPhongMaterial({ color, transparent: opacity < 1, opacity });
      return new THREE.Mesh(geo, mat);
    }

    function setCylinderBetween(cyl, a, b){
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length();
      cyl.scale.set(1, 1, 1);
      cyl.geometry.dispose();
      cyl.geometry = new THREE.CylinderGeometry(cyl.userData.radius, cyl.userData.radius, len, 14);

      cyl.position.copy(a).add(b).multiplyScalar(0.5);
      cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
    }

    // label sprite
    function makeLabelSprite(text){
      const canvas = document.createElement("canvas");
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,128,128);
      ctx.font = "bold 72px Arial";
      ctx.fillStyle = "white";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 64, 70);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(0.6, 0.6, 1);
      return sp;
    }

    // ====== Ring coordinate generators ======
    // Base planar polygon in XY
    function baseRingXY(n){
      const R = ringRadius(n);
      const pts = [];
      for(let i=0;i<n;i++){
        const ang = (i / n) * Math.PI * 2;
        pts.push(new THREE.Vector3(R * Math.cos(ang), R * Math.sin(ang), 0));
      }
      return pts;
    }

    // Simple puckering for n!=6 (visual only)
    // (n=3,4 planar; n>=5 use alternating z)
    function applyPucker(n, pts){
      if (n <= 4) return pts;

      const amp = 0.55; // visual
      for(let i=0;i<n;i++){
        // alternate z up/down; for odd n, shift pattern
        const sign = (i % 2 === 0) ? 1 : -1;
        pts[i].z = amp * sign * (n === 5 ? 0.6 : 1.0);
      }
      return pts;
    }

    // Cyclohexane chair and boat target coordinates (visual model)
    function cycloHexChair(){
      // start from hexagon XY, then apply chair-like z + slight XY warp
      const pts = baseRingXY(6);

      // chair z (alternating up/down)
      const z = [ 0.65, -0.65, 0.65, -0.65, 0.65, -0.65 ];
      for(let i=0;i<6;i++){
        pts[i].z = z[i];
      }
      // small warp to make it look more chair-like
      // pull two opposite carbons a bit
      pts[0].x *= 1.02; pts[3].x *= 1.02;
      pts[1].y *= 0.98; pts[4].y *= 0.98;

      return pts;
    }

    function cycloHexBoat(){
      const pts = baseRingXY(6);

      // boat: two "ends" up, middle down-ish
      const z = [ 0.85, 0.20, -0.45, -0.45, 0.20, 0.85 ];
      for(let i=0;i<6;i++){
        pts[i].z = z[i];
      }

      // bring ends closer (bow/stern)
      // move vertices 0 and 5 slightly inward toward center
      pts[0].multiplyScalar(0.93);
      pts[5].multiplyScalar(0.93);

      // slight twist feel
      pts[2].x *= 1.03;
      pts[3].x *= 1.03;

      return pts;
    }

    function lerpVec(a, b, t){
      return new THREE.Vector3(
        a.x + (b.x - a.x) * t,
        a.y + (b.y - a.y) * t,
        a.z + (b.z - a.z) * t
      );
    }

    // ====== Construct molecule (ring + H) ======
    function buildCycloalkane(n){
      clearGroup();

      // --- ring carbon positions ---
      let carbonPos;
      if (n === 6){
        // initial conformation
        carbonPos = (conformation === "chair") ? cycloHexChair() : cycloHexBoat();
      } else {
        carbonPos = applyPucker(n, baseRingXY(n));
      }

      // --- create carbon meshes ---
      for(let i=0;i<n;i++){
        const c = makeAtomSphere(RADIUS_C, 0x333333);
        c.position.copy(carbonPos[i]);
        c.userData.isCarbon = true;
        c.userData.index = i+1;
        moleculeGroup.add(c);
        carbonMeshes.push(c);

        if (showLabels){
          const sp = makeLabelSprite(String(i+1));
          sp.position.copy(carbonPos[i]).add(new THREE.Vector3(0, 0.55, 0));
          moleculeGroup.add(sp);
          labelSprites.push(sp);
        }
      }

      // --- C-C bonds (ring) ---
      for(let i=0;i<n;i++){
        const j = (i+1) % n;
        const a = carbonPos[i], b = carbonPos[j];
        const bond = makeBondCylinder(1, 0.08, 0xcccccc);
        bond.userData.radius = 0.08;
        moleculeGroup.add(bond);
        bondCCMeshes.push({ mesh: bond, i, j });
        setBondNow(bond, a, b, 0.08);
      }

      // --- Hydrogens (simple outward model) ---
      // cycloalkane C_nH_2n : each carbon has 2 hydrogens
      if (showHydrogen){
        const center = new THREE.Vector3();
        carbonPos.forEach(p => center.add(p));
        center.divideScalar(n);

        for(let i=0;i<n;i++){
          const p = carbonPos[i];

          // outward direction from center (with z)
          const out = p.clone().sub(center).normalize();
          // perpendicular direction to give 2 H (approx)
          const tangent = new THREE.Vector3(-out.y, out.x, 0).normalize();
          if (tangent.lengthSq() < 1e-6) tangent.set(1,0,0);

          const dirs = [
            out.clone().add(tangent.clone().multiplyScalar(0.35)).normalize(),
            out.clone().add(tangent.clone().multiplyScalar(-0.35)).normalize()
          ];

          for(let k=0;k<2;k++){
            const hPos = p.clone().add(dirs[k].multiplyScalar(BOND_CH));
            const h = makeAtomSphere(RADIUS_H, 0xadd8e6);
            h.position.copy(hPos);
            moleculeGroup.add(h);
            hydrogenMeshes.push(h);

            const bond = makeBondCylinder(1, 0.04, 0xcccccc);
            bond.userData.radius = 0.04;
            moleculeGroup.add(bond);
            bondCHMeshes.push({ mesh: bond, cIndex: i, hIndex: hydrogenMeshes.length - 1 });
            setBondNow(bond, p, hPos, 0.04);
          }
        }
      }

      // center and camera fit
      recenterAndFitCamera();
      resetView(false);
    }

    function setBondNow(bondMesh, a, b, radius){
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length();
      bondMesh.geometry.dispose();
      bondMesh.geometry = new THREE.CylinderGeometry(radius, radius, len, 14);
      bondMesh.position.copy(a).add(b).multiplyScalar(0.5);
      bondMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
    }

    function recenterAndFitCamera(){
      const box = new THREE.Box3().setFromObject(moleculeGroup);
      const center = new THREE.Vector3();
      box.getCenter(center);
      moleculeGroup.children.forEach(obj => obj.position.sub(center));

      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      let dist = Math.max(6, maxDim * 2.3 + 2);
      if (camera.aspect < 1.0) dist *= 1.4;
      camera.position.set(0, 0, dist);
    }

    // ====== Cyclohexane dynamic morph ======
    function updateCyclohexaneMorph(dt){
      if (currentRing !== 6) return;

      if (confLoopPlaying){
        // loop: chair <-> boat continuously
        confT += dt * 0.6; // speed
        const phase = (Math.sin(confT * Math.PI * 2) + 1) / 2; // 0..1
        applyConformationBlend(phase);
        return;
      }

      if (!confAnimating) return;

      // one-shot morph toward target
      const speed = 0.9;
      confT += dt * speed;
      if (confT >= 1){
        confT = 1;
        confAnimating = false;
        conformation = targetConformation;
      }
      const t = easeInOut(confT);
      if (conformation === "chair" && targetConformation === "boat"){
        applyConformationBlend(t); // chair->boat
      } else if (conformation === "boat" && targetConformation === "chair"){
        applyConformationBlend(1 - t); // boat->chair (invert)
      } else {
        applyConformationBlend(conformation === "chair" ? 0 : 1);
        confAnimating = false;
      }
    }

    function easeInOut(t){
      // smoothstep
      return t * t * (3 - 2 * t);
    }

    function applyConformationBlend(tChairToBoat01){
      // t=0 chair, t=1 boat
      const chair = cycloHexChair();
      const boat  = cycloHexBoat();

      const pts = [];
      for(let i=0;i<6;i++){
        pts.push(lerpVec(chair[i], boat[i], tChairToBoat01));
      }

      // apply positions to carbon meshes
      for(let i=0;i<6;i++){
        carbonMeshes[i].position.copy(pts[i]);
      }

      // update labels if exist
      if (showLabels){
        for(let i=0;i<labelSprites.length;i++){
          labelSprites[i].position.copy(pts[i]).add(new THREE.Vector3(0, 0.55, 0));
        }
      }

      // update CC bonds
      for(const b of bondCCMeshes){
        const a = pts[b.i];
        const c = pts[b.j];
        setBondNow(b.mesh, a, c, 0.08);
      }

      // update H + CH bonds (simple outward model recalculated)
      if (showHydrogen){
        const center = new THREE.Vector3();
        pts.forEach(p => center.add(p));
        center.divideScalar(6);

        // Each carbon has 2 H => order in hydrogenMeshes: i*2 + k
        for(let i=0;i<6;i++){
          const p = pts[i];
          const out = p.clone().sub(center).normalize();
          const tangent = new THREE.Vector3(-out.y, out.x, 0).normalize();
          if (tangent.lengthSq() < 1e-6) tangent.set(1,0,0);

          const dirs = [
            out.clone().add(tangent.clone().multiplyScalar(0.35)).normalize(),
            out.clone().add(tangent.clone().multiplyScalar(-0.35)).normalize()
          ];

          for(let k=0;k<2;k++){
            const hIndex = i*2 + k;
            const hPos = p.clone().add(dirs[k].multiplyScalar(BOND_CH));
            hydrogenMeshes[hIndex].position.copy(hPos);
          }
        }

        // update CH bonds: bondCHMeshes stores mapping
        for(const b of bondCHMeshes){
          const cPos = pts[b.cIndex];
          const hPos = hydrogenMeshes[b.hIndex].position;
          setBondNow(b.mesh, cPos, hPos, 0.04);
        }
      }

      // recenter to keep screen stable (optional light recenter)
      // → 大きく動くと見にくいので、ここは「炭素重心」基準で微調整
      const cCenter = new THREE.Vector3();
      for(let i=0;i<6;i++) cCenter.add(carbonMeshes[i].position);
      cCenter.divideScalar(6);
      moleculeGroup.children.forEach(obj => obj.position.sub(cCenter));
    }

    // ====== UI-driven updates ======
    function updateMoleculeFromUI(){
      const v = elRing.value;
      currentRing = parseInt(v, 10);

      // show cyclohex controls only for 6
      elCycloHexControls.classList.toggle("hidden", currentRing !== 6);

      // set title/desc
      const nameMap = {
        3: ["シクロプロパン", "環が小さく、ひずみが大きいと考えられます。"],
        4: ["シクロブタン", "環ひずみを減らすため、わずかに折れ曲がると考えられます。"],
        5: ["シクロペンタン", "平面から少し外れた立体形（パッカー）をとります。"],
        6: ["シクロヘキサン", "椅子型は安定、舟形は反発が増えやすい配座です。ボタンで動的に変形します。"],
        7: ["シクロヘプタン", "環が大きくなり、さまざまな立体形が可能です。"],
        8: ["シクロオクタン", "さらに柔軟で複数の立体形をとりえます。"]
      };

      const [nm, dc] = nameMap[currentRing] || ["シクロアルカン", ""];
      elTitle.textContent = nm;
      elDesc.textContent = dc;

      // reset conformation state
      if (currentRing === 6){
        conformation = "chair";
        targetConformation = "chair";
        confT = 0;
        confAnimating = false;
        confLoopPlaying = false;
        elPlayConf.classList.remove("active");
        elPlayConf.textContent = "動画再生 OFF";
      }

      buildCycloalkane(currentRing);
    }

    // ====== Controls ======
    function resetView(resetZoom = true){
      moleculeGroup.rotation.set(0.35, 0.2, 0);
      if (resetZoom){
        zoomScale = 1.0;
        moleculeGroup.scale.set(zoomScale, zoomScale, zoomScale);
      }
    }

    // ====== interactions ======
    function setupInteractions(){
      // UI show/hide
      document.getElementById('hideUIPanel').addEventListener('click', () => {
        document.getElementById('controlsPanel').classList.add('minimized');
        document.getElementById('toggleUIPanel').classList.remove('hidden');
      });
      document.getElementById('toggleUIPanel').addEventListener('click', () => {
        document.getElementById('controlsPanel').classList.remove('minimized');
        document.getElementById('toggleUIPanel').classList.add('hidden');
      });

      // Select ring
      elRing.addEventListener("change", updateMoleculeFromUI);

      // Toggle H
      elToggleHydrogen.addEventListener("click", () => {
        showHydrogen = !showHydrogen;
        elToggleHydrogen.classList.toggle("active", showHydrogen);
        elToggleHydrogen.textContent = showHydrogen ? "水素表示 ON" : "水素表示 OFF";
        buildCycloalkane(currentRing);
      });

      // Toggle labels
      elToggleLabels.addEventListener("click", () => {
        showLabels = !showLabels;
        elToggleLabels.classList.toggle("active", showLabels);
        elToggleLabels.textContent = showLabels ? "炭素番号 ON" : "炭素番号 OFF";
        buildCycloalkane(currentRing);
      });

      // Auto rotate
      elAutoRotate.addEventListener("click", () => {
        isAutoRotate = !isAutoRotate;
        elAutoRotate.textContent = isAutoRotate ? "自動回転 ON" : "自動回転 OFF";
      });

      // Reset view
      elReset.addEventListener("click", () => resetView(true));

      // Cyclohexane: one-shot toggle
      elToggleConf.addEventListener("click", () => {
        if (currentRing !== 6) return;
        if (confLoopPlaying) return; // loop中は1回切替しない

        targetConformation = (conformation === "chair") ? "boat" : "chair";
        confT = 0;
        confAnimating = true;
      });

      // Cyclohexane: loop play
      elPlayConf.addEventListener("click", () => {
        if (currentRing !== 6) return;
        confLoopPlaying = !confLoopPlaying;
        elPlayConf.classList.toggle("active", confLoopPlaying);
        elPlayConf.textContent = confLoopPlaying ? "動画再生 ON" : "動画再生 OFF";
        confAnimating = false;
        confT = 0;
      });

      // Drag rotate + pinch zoom
      let dragging = false, px = 0, py = 0;
      let lastPinchDist = 0;

      const getTouchDist = (t1, t2) => {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx*dx + dy*dy);
      };

      const onDown = (e) => {
        if (e.touches && e.touches.length === 2){
          dragging = false;
          lastPinchDist = getTouchDist(e.touches[0], e.touches[1]);
          return;
        }
        dragging = true;
        const t = e.touches?.[0] || e;
        px = t.clientX; py = t.clientY;
      };

      const onMove = (e) => {
        if (e.touches && e.touches.length === 2){
          e.preventDefault();
          const dist = getTouchDist(e.touches[0], e.touches[1]);
          if (lastPinchDist > 0){
            const ratio = dist / lastPinchDist;
            zoomScale = clamp(zoomScale * ratio, ZOOM_MIN, ZOOM_MAX);
            moleculeGroup.scale.set(zoomScale, zoomScale, zoomScale);
          }
          lastPinchDist = dist;
          return;
        }

        if (!dragging) return;
        const t = e.touches?.[0] || e;
        moleculeGroup.rotation.y += (t.clientX - px) * 0.01;
        moleculeGroup.rotation.x += (t.clientY - py) * 0.01;
        px = t.clientX; py = t.clientY;
      };

      const onUp = () => { dragging = false; lastPinchDist = 0; };

      renderer.domElement.addEventListener("mousedown", onDown);
      renderer.domElement.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);

      renderer.domElement.addEventListener("touchstart", onDown, { passive:false });
      renderer.domElement.addEventListener("touchmove", onMove, { passive:false });
      window.addEventListener("touchend", onUp);
    }

    // ====== animation loop ======
    let lastTime = performance.now();
    function animate(){
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      if (isAutoRotate){
        moleculeGroup.rotation.y += 0.008;
      }

      // cyclohexane morph update
      updateCyclohexaneMorph(dt);

      renderer.render(scene, camera);
    }

    // ====== resize ======
    window.addEventListener("resize", () => {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener("load", () => setTimeout(init, 80));
  </script>
</body>
</html>
