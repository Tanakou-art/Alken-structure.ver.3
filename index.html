<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>シクロアルカン構造シミュレータ</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="シクロアルカン" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1048/1048455.png" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { margin: 0; overflow: hidden; background:#f3f4f6; color:#111827; font-family: sans-serif; }
    canvas { display:block; touch-action: none; } /* ←ブラウザのピンチズーム無効 */
    .panel {
      position:absolute; top:16px; left:16px; z-index:10;
      background:rgba(255,255,255,0.95);
      border:1px solid #e5e7eb; border-radius:12px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.08);
      padding:12px; width:310px; max-width:calc(100% - 32px);
    }
    .hint {
      position:absolute; bottom:14px; left:14px; z-index:10;
      background:rgba(255,255,255,0.92);
      border:1px solid #e5e7eb; border-radius:12px;
      padding:10px 12px; font-size:12px; color:#374151;
      max-width: calc(100% - 28px);
    }
    @media (max-width: 768px){
      .panel{ width: 280px; }
    }
  </style>
</head>

<body>
  <div class="panel">
    <div class="flex items-center justify-between mb-2">
      <div class="text-indigo-600 font-bold text-lg">シクロアルカン構造</div>
      <button id="resetBtn" class="text-xs bg-gray-100 px-3 py-1.5 rounded-lg text-gray-600 hover:bg-gray-200">視点リセット</button>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-gray-500 mb-1">分子を選択</label>
      <select id="molSelect" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
        <option value="c3">シクロプロパン (C3H6)</option>
        <option value="c4">シクロブタン (C4H8)</option>
        <option value="c5">シクロペンタン (C5H10)</option>
        <option value="c6" selected>シクロヘキサン (C6H12)</option>
      </select>
    </div>

    <div id="c6Controls" class="mb-3">
      <label class="block text-xs font-semibold text-gray-500 mb-1">シクロヘキサン配座</label>
      <div class="grid grid-cols-2 gap-2">
        <button id="chairBtn" class="bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110">椅子形</button>
        <button id="boatBtn" class="bg-white border border-gray-300 text-gray-700 font-bold py-2 rounded-xl text-xs hover:bg-gray-50">舟形</button>
      </div>
      <button id="playBtn" class="mt-2 w-full bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110">
        椅子形 ⇄ 舟形 をアニメ再生
      </button>
      <div class="text-[11px] text-gray-500 mt-1">
        ※舟形は端の炭素が同じ側に持ち上がる形（「舟」）になるようにしています
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <button id="toggleH" class="bg-slate-900 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110">水素表示 ON</button>
      <button id="toggleLabel" class="bg-blue-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110">炭素番号 OFF</button>
    </div>

    <div class="text-[11px] text-gray-500">
      1本指ドラッグ：回転 / ピンチ：拡大・縮小（ズーム）
    </div>
  </div>

  <div class="hint" id="descBox">
    <div class="font-bold" id="descTitle">シクロヘキサン</div>
    <div id="descText">椅子形⇄舟形の違いを観察できます。</div>
  </div>

  <script type="module">
    import * as THREE from "three";

    // ======================
    // 基本パラメータ
    // ======================
    const BOND_CC = 1.54;
    const BOND_CH = 1.09;

    const R_C = 0.40;
    const R_H = 0.25;

    const COLOR_C = 0x2f2f2f;
    const COLOR_H = 0xadd8e6;
    const COLOR_BOND = 0xcccccc;

    // 水素は「平面に来ない」ように外向き＋法線方向に出す
    // outward と normal を混ぜる係数（大きいほど上下に振れる）
    const H_NORMAL_MIX = 0.55;   // 0～1 くらいで調整
    const H_OUTWARD_MIX = 0.85;  // 外側へ出す強さ

    // シーン
    let scene, camera, renderer, root;
    let showH = true;
    let showLabel = false;

    // 現在分子
    let currentMol = "c6";
    let currentConformer = "chair"; // chair / boat
    let isPlaying = false;

    // アニメ（椅子⇄舟）用
    let morphT = 0;
    let morphDir = 1; // 1: chair->boat, -1: boat->chair

    // タッチ操作
    let dragging = false;
    let lastX = 0, lastY = 0;
    let lastPinchDist = null;

    // 生成したオブジェクト参照
    let atomMeshes = [];  // {type:'C'|'H', mesh}
    let bondMeshes = [];  // mesh
    let labelSprites = [];

    // ======================
    // 形状テンプレート（炭素座標）
    // ※「見た目が舟/椅子」に見えることを優先しつつ、C-C をだいたい揃える
    // ======================
    function getRingPositions(molKey, conformer = "chair") {
      if (molKey === "c3") {
        // 正三角形（ほぼ平面）
        const R = BOND_CC / (Math.sqrt(3)); // 辺=√3 R
        return [
          new THREE.Vector3( R, 0, 0),
          new THREE.Vector3(-R/2,  Math.sqrt(3)*R/2, 0),
          new THREE.Vector3(-R/2, -Math.sqrt(3)*R/2, 0),
        ];
      }
      if (molKey === "c4") {
        // ちょいパッカリング（交互に上下）
        const R = BOND_CC / Math.sqrt(2);
        const h = 0.45;
        return [
          new THREE.Vector3( R, 0,  h),
          new THREE.Vector3( 0, R, -h),
          new THREE.Vector3(-R, 0,  h),
          new THREE.Vector3( 0,-R, -h),
        ];
      }
      if (molKey === "c5") {
        // エンベロープっぽく：1つ上げる
        const ang = (2*Math.PI)/5;
        const R = BOND_CC / (2*Math.sin(Math.PI/5)); // 正五角形の辺からR
        const hTop = 0.70;
        const pts = [];
        for (let i=0;i<5;i++){
          const a = i*ang;
          pts.push(new THREE.Vector3(R*Math.cos(a), R*Math.sin(a), 0));
        }
        pts[0].z = hTop;  // 1点だけ上
        pts[2].z = -0.20; // 反対側少し下げて「ひしゃげ感」
        return pts;
      }
      if (molKey === "c6") {
        // 椅子/舟の2テンプレを用意（スケール後に補正する）
        // ベースは六角形を少し立体化
        const ang = (2*Math.PI)/6;
        const R = BOND_CC / (2*Math.sin(Math.PI/6)); // 正六角形ならR=BOND_CC
        // ただし椅子は「交互に上下」にして、さらに前後で少しずらす
        if (conformer === "chair") {
          const h = 0.75;
          // 交互 z: +h, 0, +h, 0, +h, 0 だと弱いので、
          // ちゃんと「椅子っぽい」ように z を交互±にして、y も少し非対称に
          const pts = [];
          for (let i=0;i<6;i++){
            const a = i*ang;
            pts.push(new THREE.Vector3(R*Math.cos(a), R*Math.sin(a), 0));
          }
          // 椅子：交互に上下（±）
          pts[0].z =  h;
          pts[1].z =  0;
          pts[2].z = -h;
          pts[3].z =  0;
          pts[4].z =  h;
          pts[5].z =  0;

          // さらに椅子の「背もたれ/座面」感：一部yを寄せる
          pts[0].y *= 0.85;
          pts[2].y *= 0.85;
          pts[4].y *= 0.85;
          return pts;
        } else {
          // 舟形：端の2炭素（1,4）が同じ側へ上がる（舟の両端）
          // 中間4つは反対側へ少し沈め、舟の「底」っぽく
          const pts = [];
          for (let i=0;i<6;i++){
            const a = i*ang;
            pts.push(new THREE.Vector3(R*Math.cos(a), R*Math.sin(a), 0));
          }
          const hEnd = 1.00;  // 端を大きめに上げる
          const hMid = -0.35; // 中央を少し下げる
          pts[0].z = hEnd;   // 端
          pts[3].z = hEnd;   // 反対側の端
          pts[1].z = hMid;
          pts[2].z = 0.0;
          pts[4].z = 0.0;
          pts[5].z = hMid;

          // 舟の「すぼまり」感：少し横幅を詰める
          pts.forEach(p => { p.x *= 0.92; });
          return pts;
        }
      }
      return [];
    }

    // ======================
    // C-C 距離を「だいたい揃える」補正
    // （テンプレの形を崩しすぎず、全体スケールで平均を合わせる）
    // ======================
    function scaleToAverageBond(pts, target = BOND_CC) {
      if (pts.length < 2) return pts;
      let sum = 0;
      for (let i=0;i<pts.length;i++){
        const a = pts[i];
        const b = pts[(i+1)%pts.length];
        sum += a.distanceTo(b);
      }
      const avg = sum / pts.length;
      const s = target / (avg || 1);
      return pts.map(p => p.clone().multiplyScalar(s));
    }

    // ======================
    // 水素方向（「平面に来ない」簡易モデル）
    // 各炭素は隣接2炭素へ結合しているので Hが2つ
    // outward（環の外向き）＋ normal（環の法線）で上下に出す
    // ======================
    function computeHydrogenDirs(pts, i) {
      const n = pts.length;
      const p = pts[i];
      const pPrev = pts[(i-1+n)%n];
      const pNext = pts[(i+1)%n];

      const v1 = pPrev.clone().sub(p).normalize();
      const v2 = pNext.clone().sub(p).normalize();

      // 環の面の法線（局所）
      let normal = new THREE.Vector3().crossVectors(v1, v2);
      if (normal.lengthSq() < 1e-6) normal = new THREE.Vector3(0,0,1);
      normal.normalize();

      // 外向き（2本の結合の二等分線の逆方向）
      let outward = v1.clone().add(v2);
      if (outward.lengthSq() < 1e-6) outward = new THREE.Vector3(1,0,0);
      outward.normalize().multiplyScalar(-1);

      // 水素2本：normal の + と - に振る（平面に来ない）
      const d1 = outward.clone().multiplyScalar(H_OUTWARD_MIX).add(normal.clone().multiplyScalar(H_NORMAL_MIX)).normalize();
      const d2 = outward.clone().multiplyScalar(H_OUTWARD_MIX).add(normal.clone().multiplyScalar(-H_NORMAL_MIX)).normalize();

      return [d1, d2];
    }

    // ======================
    // 3D生成（原子・結合）
    // ======================
    function clearMolecule() {
      atomMeshes = [];
      bondMeshes = [];
      labelSprites = [];
      while(root.children.length) root.remove(root.children[0]);
    }

    function addSphere(pos, radius, color) {
      const mat = new THREE.MeshPhongMaterial({ color });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 22, 22), mat);
      mesh.position.copy(pos);
      root.add(mesh);
      return mesh;
    }

    function addBond(a, b, thickness) {
      const dir = b.clone().sub(a);
      const len = dir.length();
      const mid = a.clone().add(b).multiplyScalar(0.5);

      const geo = new THREE.CylinderGeometry(thickness, thickness, len, 16);
      const mat = new THREE.MeshPhongMaterial({ color: COLOR_BOND });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(mid);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
      root.add(mesh);
      return mesh;
    }

    function addLabel(text, pos) {
      const canvas = document.createElement("canvas");
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,256,256);
      ctx.fillStyle = "rgba(0,0,0,0.75)";
      ctx.beginPath(); ctx.arc(128,128,90,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "white";
      ctx.font = "bold 120px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 140);

      const tex = new THREE.CanvasTexture(canvas);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest:false }));
      spr.position.copy(pos);
      spr.scale.set(0.55,0.55,1);
      root.add(spr);
      return spr;
    }

    function buildRing(molKey, conformer) {
      clearMolecule();

      // 炭素座標
      let pts = getRingPositions(molKey, conformer);
      pts = scaleToAverageBond(pts, BOND_CC);

      // 炭素
      const carbonMeshes = pts.map((p, idx) => {
        const m = addSphere(p, R_C, COLOR_C);
        m.userData = { atomType:"C", index: idx };
        atomMeshes.push({ type:"C", mesh:m });
        return m;
      });

      // C-C結合（環）
      for (let i=0;i<pts.length;i++){
        const a = pts[i];
        const b = pts[(i+1)%pts.length];
        const bond = addBond(a, b, 0.08);
        bondMeshes.push(bond);
      }

      // ラベル
      if (showLabel) {
        for (let i=0;i<pts.length;i++){
          const spr = addLabel(String(i+1), pts[i].clone().add(new THREE.Vector3(0,0.55,0)));
          labelSprites.push(spr);
        }
      }

      // 水素
      if (showH) {
        for (let i=0;i<pts.length;i++){
          const dirs = computeHydrogenDirs(pts, i);
          dirs.forEach(d => {
            const hPos = pts[i].clone().add(d.clone().multiplyScalar(BOND_CH));
            const hm = addSphere(hPos, R_H, COLOR_H);
            hm.userData = { atomType:"H" };
            atomMeshes.push({ type:"H", mesh:hm });

            // C-H結合
            const b = addBond(pts[i], hPos, 0.045);
            bondMeshes.push(b);
          });
        }
      }

      // 見やすく中央へ寄せ
      const box = new THREE.Box3().setFromObject(root);
      const center = new THREE.Vector3();
      box.getCenter(center);
      root.children.forEach(ch => ch.position.sub(center));

      // カメラ距離調整
      const size = new THREE.Vector3();
      box.setFromObject(root).getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = Math.max(6, maxDim * 2.4 + 2);
      camera.position.set(0, 0, dist);

      updateDescription(molKey, conformer);
    }

    // ======================
    // 椅子⇄舟のモーフ
    // ======================
    function buildC6MorphFrame(t) {
      // t=0 chair, t=1 boat
      clearMolecule();

      let chair = scaleToAverageBond(getRingPositions("c6", "chair"), BOND_CC);
      let boat  = scaleToAverageBond(getRingPositions("c6", "boat"),  BOND_CC);

      const pts = [];
      for (let i=0;i<6;i++){
        const p = chair[i].clone().lerp(boat[i], t);
        pts.push(p);
      }
      // 平均結合長を軽く補正（全体スケール）
      const pts2 = scaleToAverageBond(pts, BOND_CC);

      // 炭素
      const carbonMeshes = pts2.map((p, idx) => {
        const m = addSphere(p, R_C, COLOR_C);
        m.userData = { atomType:"C", index: idx };
        atomMeshes.push({ type:"C", mesh:m });
        return m;
      });

      // 環結合
      for (let i=0;i<6;i++){
        const a = pts2[i];
        const b = pts2[(i+1)%6];
        const bond = addBond(a, b, 0.08);
        bondMeshes.push(bond);
      }

      // ラベル
      if (showLabel) {
        for (let i=0;i<6;i++){
          const spr = addLabel(String(i+1), pts2[i].clone().add(new THREE.Vector3(0,0.55,0)));
          labelSprites.push(spr);
        }
      }

      // 水素
      if (showH) {
        for (let i=0;i<6;i++){
          const dirs = computeHydrogenDirs(pts2, i);
          dirs.forEach(d => {
            const hPos = pts2[i].clone().add(d.clone().multiplyScalar(BOND_CH));
            const hm = addSphere(hPos, R_H, COLOR_H);
            atomMeshes.push({ type:"H", mesh:hm });
            const b = addBond(pts2[i], hPos, 0.045);
            bondMeshes.push(b);
          });
        }
      }

      // センタリング
      const box = new THREE.Box3().setFromObject(root);
      const center = new THREE.Vector3();
      box.getCenter(center);
      root.children.forEach(ch => ch.position.sub(center));
    }

    // ======================
    // 説明文
    // ======================
    function updateDescription(molKey, conformer) {
      const title = document.getElementById("descTitle");
      const text = document.getElementById("descText");

      if (molKey === "c3") {
        title.textContent = "シクロプロパン";
        text.textContent  = "環が小さく、ひずみが大きいと考えられます。";
      } else if (molKey === "c4") {
        title.textContent = "シクロブタン";
        text.textContent  = "平面だとひずみが大きいため、少し折れ曲がった形をとります。";
      } else if (molKey === "c5") {
        title.textContent = "シクロペンタン";
        text.textContent  = "エンベロープ（封筒）型のように一部が持ち上がる配座をとりやすいです。";
      } else if (molKey === "c6") {
        title.textContent = "シクロヘキサン";
        if (conformer === "chair") {
          text.textContent = "椅子形：ねじれひずみが小さく比較的安定。軸/赤道の違いも観察できます。";
        } else {
          text.textContent = "舟形：端の炭素が近づき、ねじれ/立体ひずみが増えて不安定になりやすい。";
        }
      }
    }

    // ======================
    // UI
    // ======================
    function setC6ButtonState(conformer) {
      const chairBtn = document.getElementById("chairBtn");
      const boatBtn  = document.getElementById("boatBtn");
      if (conformer === "chair") {
        chairBtn.className = "bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110";
        boatBtn.className  = "bg-white border border-gray-300 text-gray-700 font-bold py-2 rounded-xl text-xs hover:bg-gray-50";
      } else {
        boatBtn.className  = "bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs hover:brightness-110";
        chairBtn.className = "bg-white border border-gray-300 text-gray-700 font-bold py-2 rounded-xl text-xs hover:bg-gray-50";
      }
    }

    // ======================
    // 視点リセット
    // ======================
    function resetView() {
      root.rotation.set(0.35, 0.3, 0);
      // 距離は buildRing 側で調整しているが、再計算したいので再描画
      if (currentMol === "c6" && isPlaying) {
        // 再生中は距離だけ軽く
        // （buildC6MorphFrameが毎フレームセンタリングするのでここは固定でOK）
      } else {
        buildRing(currentMol, currentConformer);
      }
    }

    // ======================
    // 初期化
    // ======================
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 2000);
      camera.position.set(0, 0, 10);

      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0xf3f4f6, 1);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const dl = new THREE.DirectionalLight(0xffffff, 0.65);
      dl.position.set(7, 10, 6);
      scene.add(dl);

      root = new THREE.Group();
      scene.add(root);

      // UI 初期
      document.getElementById("molSelect").value = "c6";
      document.getElementById("c6Controls").style.display = "block";
      setC6ButtonState("chair");

      // 初回生成
      currentMol = "c6";
      currentConformer = "chair";
      buildRing("c6", "chair");
      root.rotation.set(0.35, 0.3, 0);

      // ========== UIイベント ==========
      document.getElementById("molSelect").addEventListener("change", (e) => {
        currentMol = e.target.value;
        isPlaying = false;
        document.getElementById("playBtn").textContent = "椅子形 ⇄ 舟形 をアニメ再生";
        morphT = 0; morphDir = 1;

        if (currentMol === "c6") {
          document.getElementById("c6Controls").style.display = "block";
          currentConformer = "chair";
          setC6ButtonState("chair");
          buildRing("c6", "chair");
        } else {
          document.getElementById("c6Controls").style.display = "none";
          currentConformer = "chair";
          buildRing(currentMol, "chair");
        }
        resetView();
      });

      document.getElementById("chairBtn").addEventListener("click", () => {
        if (currentMol !== "c6") return;
        isPlaying = false;
        document.getElementById("playBtn").textContent = "椅子形 ⇄ 舟形 をアニメ再生";
        currentConformer = "chair";
        setC6ButtonState("chair");
        morphT = 0; morphDir = 1;
        buildRing("c6", "chair");
        resetView();
      });

      document.getElementById("boatBtn").addEventListener("click", () => {
        if (currentMol !== "c6") return;
        isPlaying = false;
        document.getElementById("playBtn").textContent = "椅子形 ⇄ 舟形 をアニメ再生";
        currentConformer = "boat";
        setC6ButtonState("boat");
        morphT = 1; morphDir = -1;
        buildRing("c6", "boat");
        resetView();
      });

      document.getElementById("playBtn").addEventListener("click", () => {
        if (currentMol !== "c6") return;
        isPlaying = !isPlaying;
        document.getElementById("playBtn").textContent = isPlaying ? "アニメ停止" : "椅子形 ⇄ 舟形 をアニメ再生";
      });

      document.getElementById("toggleH").addEventListener("click", (e) => {
        showH = !showH;
        e.target.textContent = showH ? "水素表示 ON" : "水素表示 OFF";
        if (currentMol === "c6" && isPlaying) {
          // 再生中は次フレームで反映
        } else {
          buildRing(currentMol, currentConformer);
          resetView();
        }
      });

      document.getElementById("toggleLabel").addEventListener("click", (e) => {
        showLabel = !showLabel;
        e.target.textContent = showLabel ? "炭素番号 ON" : "炭素番号 OFF";
        if (currentMol === "c6" && isPlaying) {
          // 再生中は次フレームで反映
        } else {
          buildRing(currentMol, currentConformer);
          resetView();
        }
      });

      document.getElementById("resetBtn").addEventListener("click", resetView);

      // ========== タッチ/マウス操作 ==========
      const el = renderer.domElement;

      el.addEventListener("mousedown", (ev) => {
        dragging = true;
        lastX = ev.clientX; lastY = ev.clientY;
      });
      window.addEventListener("mouseup", () => dragging = false);
      window.addEventListener("mousemove", (ev) => {
        if (!dragging) return;
        const dx = ev.clientX - lastX;
        const dy = ev.clientY - lastY;
        root.rotation.y += dx * 0.01;
        root.rotation.x += dy * 0.01;
        lastX = ev.clientX; lastY = ev.clientY;
      });

      el.addEventListener("touchstart", (ev) => {
        if (ev.touches.length === 1) {
          dragging = true;
          lastX = ev.touches[0].clientX;
          lastY = ev.touches[0].clientY;
          lastPinchDist = null;
        } else if (ev.touches.length === 2) {
          dragging = false;
          const dx = ev.touches[0].clientX - ev.touches[1].clientX;
          const dy = ev.touches[0].clientY - ev.touches[1].clientY;
          lastPinchDist = Math.hypot(dx, dy);
        }
      }, { passive:false });

      el.addEventListener("touchmove", (ev) => {
        ev.preventDefault();

        if (ev.touches.length === 1 && dragging) {
          const x = ev.touches[0].clientX;
          const y = ev.touches[0].clientY;
          const dx = x - lastX;
          const dy = y - lastY;
          root.rotation.y += dx * 0.01;
          root.rotation.x += dy * 0.01;
          lastX = x; lastY = y;
        } else if (ev.touches.length === 2) {
          const dx = ev.touches[0].clientX - ev.touches[1].clientX;
          const dy = ev.touches[0].clientY - ev.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (lastPinchDist != null) {
            const delta = (lastPinchDist - dist) * 0.02; // ピンチの感度
            camera.position.z = THREE.MathUtils.clamp(camera.position.z + delta, 3.5, 60);
          }
          lastPinchDist = dist;
        }
      }, { passive:false });

      el.addEventListener("touchend", (ev) => {
        if (ev.touches.length === 0) {
          dragging = false;
          lastPinchDist = null;
        }
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    // ======================
    // アニメーションループ
    // ======================
    function animate() {
      requestAnimationFrame(animate);

      // 椅子⇄舟 自動再生（ボタンでON/OFF）
      if (currentMol === "c6" && isPlaying) {
        const speed = 0.010; // 速さ
        morphT += morphDir * speed;
        if (morphT >= 1) { morphT = 1; morphDir = -1; currentConformer = "boat"; setC6ButtonState("boat"); }
        if (morphT <= 0) { morphT = 0; morphDir = 1;  currentConformer = "chair"; setC6ButtonState("chair"); }

        buildC6MorphFrame(morphT);
        updateDescription("c6", (morphT < 0.5) ? "chair" : "boat");
      }

      renderer.render(scene, camera);
    }

    window.addEventListener("load", () => setTimeout(init, 50));
  </script>
</body>
</html>
